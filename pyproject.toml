[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "werrio"
version = "0.5.2"
authors = [
  { name="ITouch Systems", email="info@itouch.com.tr" },
  { name="Volkan Dagli", email="ask@answerr.me" }
]
description = "WERR: Zero-Memory Fractal System-One Decision Engine (Waves & Errors)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0"
]

[project.urls]
"Homepage" = "https://werr.io"
"Academic Portal" = "https://werr.io"
"Corporate Portal" = "https://werracle.com"
"Web3 Protocol" = "https://werracle.io"
"Repository" = "https://github.com/pCwOrM/werr"
"Web Simulator" = "https://werr.io"
"answerr Platform" = "https://answerr.me"
"Base Research" = "https://github.com/pCwOrM/fractal-neural-synthesis"

[tool.setuptools.packages.find]
where = ["."]
include = ["werr*", "wevv*", "werrio*"]
exclude = ["dataset*", "tests*", "examples*"]
