<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-twin" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0f1526" stop-opacity="1"/>
      <stop offset="60%" stop-color="#07090e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="1"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="twin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="16" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Portal Gradient -->
    <linearGradient id="portal-grad-twin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Crystal Gradients -->
    <linearGradient id="c-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="c-facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="c-facet-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="url(#bg-twin)" rx="18" />

  <!-- Center Dividing Energy Seam -->
  <line x1="600" y1="80" x2="600" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6" />
  <circle cx="600" cy="300" r="14" fill="#07090e" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  <text x="600" y="304" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">&amp;</text>

  <!-- ================= LEFT PRODUCT: answerr (CLOUD DECISION PLATFORM) ================= -->
  <g id="panel-answerr" transform="translate(40, 0)">
    <!-- Ambient Halo -->
    <circle cx="280" cy="220" r="100" fill="none" stroke="#8b5cf6" stroke-width="14" opacity="0.22" filter="url(#twin-glow)" />

    <!-- Concentric Orbit Rings -->
    <circle cx="280" cy="220" r="112" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.5" />
    <circle cx="280" cy="220" r="82" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,6" opacity="0.4" />

    <!-- Main Portal Ring -->
    <circle cx="280" cy="220" r="96" fill="none" stroke="url(#portal-grad-twin)" stroke-width="6" stroke-linecap="round" filter="url(#twin-glow)" />

    <!-- Dynamic Flow Arc -->
    <path d="M 200 220 A 80 80 0 1 1 360 220 A 72 72 0 1 0 200 220 Z"
          fill="#38bdf8" opacity="0.35" filter="url(#twin-glow)" />

    <!-- Satellite Orbit Nodes -->
    <circle cx="355" cy="145" r="4.5" fill="#ffffff" filter="url(#twin-glow)" />
    <circle cx="205" cy="295" r="4" fill="#c084fc" filter="url(#twin-glow)" />

    <!-- Central Aperture Void with Glowing Dot -->
    <circle cx="280" cy="220" r="38" fill="#07090e" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="280" cy="220" r="3" fill="#ffffff" filter="url(#twin-glow)" />

    <!-- Wordmark -->
    <text x="280" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" fill="#ffffff" text-anchor="middle">
      answ<tspan fill="#818cf8">e</tspan><tspan fill="#38bdf8">rr</tspan>
    </text>

    <!-- Role / Tagline -->
    <text x="280" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700" letter-spacing="0.22em" fill="#a5b4fc" text-anchor="middle">
      CONVERSATIONAL DECISION PLATFORM
    </text>
    <text x="280" y="482" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" text-anchor="middle">
      Zero-Hallucination System-1 Decision Cloud
    </text>
    <text x="280" y="505" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">
      https://answerr.me &bull; api.answerr.me
    </text>
  </g>

  <!-- ================= RIGHT PRODUCT: werr (EMBEDDED REFLEX RUNTIME) ================= -->
  <g id="panel-werr" transform="translate(620, 0)">
    <!-- Ambient Core Glow -->
    <polygon points="175,140 280,105 385,140 280,325" fill="#38bdf8" opacity="0.18" filter="url(#twin-glow)" />
    <polygon points="280,105 385,140 330,265 280,185" fill="#fbbf24" opacity="0.22" filter="url(#twin-glow)" />

    <!-- 3D Crystalline Faceted W Core -->
    <g stroke="#070a12" stroke-width="1.4" stroke-linejoin="round" filter="url(#twin-glow)">
      <!-- Left Tower -->
      <polygon points="175,140 225,200 175,245 140,190" fill="url(#c-facet-left)" />
      <polygon points="175,140 225,200 230,275 175,245" fill="#0369a1" />

      <!-- Center Spine Apex -->
      <polygon points="280,105 225,200 280,190" fill="url(#c-facet-spine)" />
      <polygon points="280,105 280,190 335,200" fill="url(#c-facet-right)" />

      <!-- Inner Valleys -->
      <polygon points="225,200 280,190 280,270 230,275" fill="#0c4a6e" />
      <polygon points="335,200 280,190 280,270 330,275" fill="#b45309" />

      <!-- Right Tower -->
      <polygon points="385,140 335,200 330,275 385,245" fill="#b45309" />
      <polygon points="385,140 335,200 385,245 420,190" fill="url(#c-facet-right)" />

      <!-- Bottom Keel V -->
      <polygon points="230,275 280,270 280,335 250,315" fill="url(#c-facet-left)" />
      <polygon points="330,275 280,270 280,335 310,315" fill="url(#c-facet-right)" />
      <polygon points="280,270 250,315 280,335" fill="#0284c7" />
      <polygon points="280,270 310,315 280,335" fill="#d97706" />
    </g>

    <!-- Specular Ridge Highlights -->
    <line x1="280" y1="105" x2="280" y2="190" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    <line x1="280" y1="270" x2="280" y2="335" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    <circle cx="280" cy="105" r="4" fill="#ffffff" filter="url(#twin-glow)" />
    <circle cx="175" cy="140" r="3" fill="#e0f2fe" />
    <circle cx="385" cy="140" r="3" fill="#fef08a" />
    <circle cx="280" cy="335" r="3.5" fill="#38bdf8" />

    <!-- Wordmark -->
    <text x="280" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="52" font-weight="900" letter-spacing="-0.03em" text-anchor="middle">
      <tspan fill="#38bdf8">w</tspan><tspan fill="#e2e8f0">e</tspan><tspan fill="#fbbf24">rr</tspan>
    </text>

    <!-- Role / Tagline -->
    <text x="280" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700" letter-spacing="0.22em" fill="#38bdf8" text-anchor="middle">
      GEOMETRIC REFLEX CORE
    </text>
    <text x="280" y="482" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" text-anchor="middle">
      "Don't call an API. Embed the reflex."
    </text>
    <text x="280" y="505" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">
      0-Byte VRAM &bull; &lt; 0.5 ms &bull; pip install werr
    </text>
  </g>
</svg>
