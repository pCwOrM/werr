<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Ambient Radial -->
    <radialGradient id="bg-twin-main" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1424" stop-opacity="1"/>
      <stop offset="50%" stop-color="#07090e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="1"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="twin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="twin-shine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Portal Gradients -->
    <linearGradient id="portal-grad-combo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Crystalline Facet Gradients -->
    <linearGradient id="c-wing-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="c-wing-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="c-spine-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bg-twin-main)" rx="20" />

  <!-- Center Dividing Seam with Symmetry Icon -->
  <line x1="600" y1="60" x2="600" y2="580" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6" />
  <circle cx="600" cy="300" r="16" fill="#07090e" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
  <text x="600" y="305" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">&amp;</text>

  <!-- ================= LEFT PRODUCT: answerr (CLOUD DECISION PLATFORM) ================= -->
  <g id="panel-answerr" transform="translate(30, 0)">
    <!-- Ambient Halo -->
    <circle cx="285" cy="225" r="110" fill="none" stroke="#8b5cf6" stroke-width="18" opacity="0.22" filter="url(#twin-glow)" />

    <!-- Concentric Orbit Rings -->
    <circle cx="285" cy="225" r="126" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="12,6,4,6" opacity="0.6" />
    <circle cx="285" cy="225" r="90" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="6,6" opacity="0.5" />
    <circle cx="285" cy="225" r="64" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="2,6" opacity="0.7" />

    <!-- Main Portal Ring -->
    <circle cx="285" cy="225" r="106" fill="none" stroke="url(#portal-grad-combo)" stroke-width="7" stroke-linecap="round" filter="url(#twin-shine)" />

    <!-- Specular Crescent Arc -->
    <path d="M 200 225 A 85 85 0 0 1 370 225 A 75 75 0 0 0 200 225 Z"
          fill="#38bdf8" opacity="0.45" filter="url(#twin-glow)" />

    <!-- Satellites -->
    <circle cx="365" cy="145" r="4.5" fill="#ffffff" filter="url(#twin-shine)" />
    <circle cx="205" cy="305" r="4" fill="#c084fc" filter="url(#twin-shine)" />

    <!-- Center Void with Spark -->
    <circle cx="285" cy="225" r="42" fill="#07090e" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,4" />
    <circle cx="285" cy="225" r="3.5" fill="#ffffff" filter="url(#twin-shine)" />

    <!-- Brand Wordmark -->
    <text x="285" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em" fill="#ffffff" text-anchor="middle">
      answ<tspan fill="#818cf8">e</tspan><tspan fill="#38bdf8">rr</tspan>
    </text>

    <!-- Role Tagline -->
    <text x="285" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12.5" font-weight="800" letter-spacing="0.25em" fill="#a5b4fc" text-anchor="middle">
      CONVERSATIONAL API APERTURE
    </text>

    <!-- Architecture Description -->
    <text x="285" y="500" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Zero-Hallucination System-1 Decision Cloud
    </text>

    <!-- 3 Core Strengths -->
    <text x="285" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Natural Language Dialogue Integration &#8226; Zapier &amp; n8n Webhooks
    </text>
    <text x="285" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Microservice Cloud Routing &#8226; Real-Time SSE Streams
    </text>

    <!-- Link Badge -->
    <text x="285" y="595" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
      https://answerr.me &#8226; api.answerr.me
    </text>
  </g>

  <!-- ================= RIGHT PRODUCT: werr (EMBEDDED REFLEX RUNTIME) ================= -->
  <g id="panel-werr" transform="translate(615, 0)">
    <!-- Ambient Core Glow -->
    <polygon points="180,135 285,90 390,135 285,340" fill="#38bdf8" opacity="0.22" filter="url(#twin-glow)" />
    <polygon points="285,90 390,135 330,270 285,185" fill="#fbbf24" opacity="0.25" filter="url(#twin-glow)" />

    <!-- 3D Crystalline Faceted W Core -->
    <g stroke="#050811" stroke-width="1.2" stroke-linejoin="round" filter="url(#twin-shine)">
      <!-- Left Tower -->
      <polygon points="180,135 230,205 180,250 145,190" fill="url(#c-wing-l)" />
      <polygon points="180,135 230,205 235,285 180,250" fill="#0369a1" />

      <!-- Center Spine Apex -->
      <polygon points="285,90 230,205 285,190" fill="url(#c-spine-mid)" />
      <polygon points="285,90 285,190 340,205" fill="url(#c-wing-r)" />

      <!-- Inner Valleys -->
      <polygon points="230,205 285,190 285,280 235,285" fill="#0c4a6e" />
      <polygon points="340,205 285,190 285,280 335,285" fill="#92400e" />

      <!-- Right Tower -->
      <polygon points="390,135 340,205 335,285 390,250" fill="#b45309" />
      <polygon points="390,135 340,205 390,250 425,190" fill="url(#c-wing-r)" />

      <!-- Bottom Keel V -->
      <polygon points="235,285 285,280 285,350 255,330" fill="url(#c-wing-l)" />
      <polygon points="335,285 285,280 285,350 315,330" fill="url(#c-wing-r)" />
      <polygon points="285,280 255,330 285,350" fill="#0284c7" />
      <polygon points="285,280 315,330 285,350" fill="#d97706" />
    </g>

    <!-- Specular Ridge Highlights -->
    <line x1="285" y1="90" x2="285" y2="190" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <line x1="285" y1="280" x2="285" y2="350" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <circle cx="285" cy="90" r="4.5" fill="#ffffff" filter="url(#twin-shine)" />
    <circle cx="180" cy="135" r="3.5" fill="#e0f2fe" />
    <circle cx="390" cy="135" r="3.5" fill="#fef08a" />
    <circle cx="285" cy="350" r="4" fill="#38bdf8" />

    <!-- Brand Wordmark -->
    <text x="285" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="56" font-weight="900" letter-spacing="-0.03em" text-anchor="middle">
      <tspan fill="#38bdf8">w</tspan><tspan fill="#f1f5f9">e</tspan><tspan fill="#fbbf24">rr</tspan>
    </text>

    <!-- Role Tagline -->
    <text x="285" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12.5" font-weight="800" letter-spacing="0.25em" fill="#38bdf8" text-anchor="middle">
      GEOMETRIC REFLEX CORE
    </text>

    <!-- Architecture Description -->
    <text x="285" y="500" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
      "Don't call an API. Embed the reflex."
    </text>

    <!-- 3 Core Strengths -->
    <text x="285" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      0-Byte Tensor Memory &#8226; &lt; 0.5 ms Local Latency
    </text>
    <text x="285" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      24-Byte Coordinate Seed &#8226; Autonomous &amp; Air-Gapped
    </text>

    <!-- Link Badge -->
    <text x="285" y="595" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">
      pip install werr &#8226; werr.h &#8226; github.com/pCwOrM/werr
    </text>
  </g>
</svg>
