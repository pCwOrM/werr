<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow-cusp" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#07090e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="1"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="cusp-glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b1" />
      <feGaussianBlur stdDeviation="22" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cusp-glow-fine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Wave Gradient -->
    <linearGradient id="wave-grad-fixed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <!-- Cusp Amber Gradient -->
    <linearGradient id="cusp-grad-fixed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Bifurcation Upper rr -->
    <linearGradient id="rr-up-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Bifurcation Lower rr -->
    <linearGradient id="rr-dn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="650" fill="url(#bg-glow-cusp)" rx="20" />

  <!-- Subtle Coordinate Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="260" x2="720" y2="260" stroke-dasharray="4,6" />
    <line x1="400" y1="60" x2="400" y2="460" stroke-dasharray="4,6" />
    <circle cx="400" cy="260" r="150" fill="none" stroke-dasharray="2,8" />
  </g>

  <!-- ================= LOGO SYMBOL: RESONANT CUSP ================= -->
  <g id="symbol-group">

    <!-- 1. Left Wing: Analog Sine Wave (Wave) -->
    <!-- Underglow Trace -->
    <path d="M 120 260 C 160 260, 180 140, 230 140 C 275 140, 290 340, 335 340 C 365 340, 380 280, 400 260"
          fill="none" stroke="#06b6d4" stroke-width="16" opacity="0.3" filter="url(#cusp-glow-heavy)" stroke-linecap="round" />
    <!-- Core Bright Trace -->
    <path d="M 120 260 C 160 260, 180 140, 230 140 C 275 140, 290 340, 335 340 C 365 340, 380 280, 400 260"
          fill="none" stroke="url(#wave-grad-fixed)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Wave Node Beads -->
    <circle cx="230" cy="140" r="5.5" fill="#e0f2fe" filter="url(#cusp-glow-fine)" />
    <circle cx="335" cy="340" r="5.5" fill="#e0f2fe" filter="url(#cusp-glow-fine)" />

    <!-- 2. Center: Mandelbrot Cardioid Cusp & Escape Boundary (|Z|=2) -->
    <g id="mandelbrot-cusp" filter="url(#cusp-glow-heavy)">
      <!-- Cardioid Cusp Facets -->
      <polygon points="400,260 438,210 455,260 438,310" fill="url(#cusp-grad-fixed)" opacity="0.3" />
      
      <!-- Spikes / Micro-filaments representing fractal boundary recursion -->
      <path d="M 390 260 
               L 405 242 L 400 248 L 415 230 L 410 240 L 428 220 L 422 234 L 442 215
               L 435 238 L 452 245 L 440 252 L 460 260
               L 440 268 L 452 275 L 435 282 L 442 305
               L 422 286 L 428 300 L 410 280 L 415 290 L 400 272 L 405 278 Z"
            fill="url(#cusp-grad-fixed)" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Center Singularity / Focal Point -->
      <circle cx="400" cy="260" r="4.5" fill="#ffffff" filter="url(#cusp-glow-fine)" />
      <circle cx="460" cy="260" r="6.5" fill="#fef08a" filter="url(#cusp-glow-fine)" />
    </g>

    <!-- 3. Right Wing: Resonant Bifurcation (Double-R Trill / Recurse) -->
    <!-- Upper Resonant Harmonic Branch (r1) -->
    <path d="M 460 260 C 490 220, 530 150, 590 150 C 640 150, 675 190, 680 230"
          fill="none" stroke="#a855f7" stroke-width="14" opacity="0.3" filter="url(#cusp-glow-heavy)" stroke-linecap="round" />
    <path d="M 460 260 C 490 220, 530 150, 590 150 C 640 150, 675 190, 680 230"
          fill="none" stroke="url(#rr-up-grad)" stroke-width="6" stroke-linecap="round" />

    <!-- Parallel Upper Harmonic (Echo 1) -->
    <path d="M 480 250 C 510 200, 550 130, 610 130 C 660 130, 695 170, 700 210"
          fill="none" stroke="#c084fc" stroke-width="3" opacity="0.75" stroke-dasharray="8,4" />

    <!-- Lower Resonant Harmonic Branch (r2) -->
    <path d="M 460 260 C 490 300, 530 370, 590 370 C 640 370, 675 330, 680 290"
          fill="none" stroke="#6366f1" stroke-width="14" opacity="0.3" filter="url(#cusp-glow-heavy)" stroke-linecap="round" />
    <path d="M 460 260 C 490 300, 530 370, 590 370 C 640 370, 675 330, 680 290"
          fill="none" stroke="url(#rr-dn-grad)" stroke-width="6" stroke-linecap="round" />

    <!-- Parallel Lower Harmonic (Echo 2) -->
    <path d="M 480 270 C 510 320, 550 390, 610 390 C 660 390, 695 350, 700 310"
          fill="none" stroke="#818cf8" stroke-width="3" opacity="0.75" stroke-dasharray="8,4" />

    <!-- Terminal Resonance Nodes -->
    <circle cx="680" cy="230" r="4.5" fill="#f5d0fe" filter="url(#cusp-glow-fine)" />
    <circle cx="680" cy="290" r="4.5" fill="#c7d2fe" filter="url(#cusp-glow-fine)" />
    <circle cx="700" cy="210" r="3.5" fill="#ffffff" />
    <circle cx="700" cy="310" r="3.5" fill="#ffffff" />

  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <g id="brand-text" text-anchor="middle">
    <text x="400" y="515" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', Arial, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="-0.03em">
      <tspan fill="#38bdf8">w</tspan><tspan fill="#fbbf24">e</tspan><tspan fill="#a855f7">rr</tspan>
    </text>

    <text x="400" y="555" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="0.30em" 
          fill="#94a3b8">
      WAVE-ERROR REFLEX RUNTIME
    </text>

    <text x="400" y="585" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.1em" 
          fill="#64748b">
      0-BYTE VRAM &#8226; EMBEDDED SYSTEM-1 KERNEL
    </text>
  </g>
</svg>
