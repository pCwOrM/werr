<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow-core" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#080b14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="core-glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-glow-fine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="flare-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Crystalline Facet Gradients (Left Half - Wave Dynamics) -->
    <linearGradient id="c-top-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="c-top-mid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="c-mid-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="c-dark-shadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold / Amber Crystalline Facet Gradients (Right Half - Error / Recurse) -->
    <linearGradient id="g-top-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="g-top-mid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="g-mid-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="g-dark-shadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Center Spine Apex Facets (Fault line between Wave & Error) -->
    <linearGradient id="spine-apex-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="spine-apex-g" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="text-werr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="url(#bg-glow-core)" rx="20" />

  <!-- Subtle Cybernetic Lattice & Coordinate Markings -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="260" x2="700" y2="260" stroke-dasharray="4,8" />
    <line x1="400" y1="40" x2="400" y2="480" stroke-dasharray="4,8" />
    <circle cx="400" cy="260" r="180" fill="none" stroke-dasharray="2,6" />
    <circle cx="400" cy="260" r="230" fill="none" stroke-dasharray="8,12" />
  </g>

  <!-- Circuit Micro-traces -->
  <g opacity="0.12" stroke="#67e8f9" stroke-width="1" fill="none">
    <path d="M 160 120 L 220 120 L 250 150" />
    <path d="M 640 120 L 580 120 L 550 150" />
    <path d="M 180 380 L 230 380 L 270 340" />
    <path d="M 620 380 L 570 380 L 530 340" />
    <circle cx="160" cy="120" r="2.5" fill="#38bdf8" />
    <circle cx="640" cy="120" r="2.5" fill="#fbbf24" />
  </g>

  <!-- ================= 3D MULTIFACETED CRYSTALLINE W CORE ================= -->
  <!-- 1. Ambient Volumetric Underglow -->
  <g id="volumetric-backlight" filter="url(#core-glow-heavy)">
    <polygon points="210,130 400,60 590,130 400,430" fill="#38bdf8" opacity="0.25" />
    <polygon points="400,60 590,130 500,320 400,210" fill="#fbbf24" opacity="0.3" />
    <circle cx="400" cy="245" r="90" fill="#0284c7" opacity="0.2" />
  </g>

  <!-- 2. High-Definition Precision Facets -->
  <g id="crystal-mesh" stroke="#050811" stroke-width="1.2" stroke-linejoin="round">

    <!-- ===== LEFT TOWER: ELECTRIC CYAN PRISM (WAVE) ===== -->
    <!-- Peak 1 Apex: (210, 130) -->
    <!-- Facet L1: Top Outer Left Flank -->
    <polygon points="210,130 145,215 220,225" fill="url(#c-top-bright)" />
    <!-- Facet L2: Top Outer Ridge -->
    <polygon points="210,130 220,225 295,195" fill="url(#c-top-mid)" />
    <!-- Facet L3: Lower Outer Left Flank -->
    <polygon points="145,215 200,310 220,225" fill="url(#c-mid-deep)" />
    <!-- Facet L4: Outer Wing Tip Bottom Edge -->
    <polygon points="145,215 130,230 185,325 200,310" fill="url(#c-dark-shadow)" />
    <!-- Facet L5: Left Valley Inner Face -->
    <polygon points="220,225 200,310 290,325 295,195" fill="url(#c-mid-deep)" />

    <!-- ===== CENTER SPINE: APEX CROWN (FAULT-LINE) ===== -->
    <!-- Center Apex Point: (400, 55) -->
    <!-- Center Inner Valley Left: (295, 195), Center Inner Valley Right: (505, 195) -->
    <!-- Facet C1: Central Left Apex Flank (Cyan lit) -->
    <polygon points="400,55 295,195 400,180" fill="url(#spine-apex-c)" />
    <!-- Facet C2: Central Right Apex Flank (Gold lit) -->
    <polygon points="400,55 400,180 505,195" fill="url(#spine-apex-g)" />

    <!-- Central Mid-Rib Keel -->
    <!-- Facet C3: Center Mid Valley Left -->
    <polygon points="295,195 400,180 400,305 310,325" fill="url(#c-dark-shadow)" />
    <!-- Facet C4: Center Mid Valley Right -->
    <polygon points="505,195 400,180 400,305 490,325" fill="url(#g-dark-shadow)" />

    <!-- ===== RIGHT TOWER: RADIANT GOLD PRISM (ERROR / RECURSE) ===== -->
    <!-- Peak 2 Apex: (590, 130) -->
    <!-- Facet R1: Top Inner Ridge -->
    <polygon points="590,130 505,195 580,225" fill="url(#g-top-mid)" />
    <!-- Facet R2: Top Outer Right Flank -->
    <polygon points="590,130 580,225 655,215" fill="url(#g-top-bright)" />
    <!-- Facet R3: Right Valley Inner Face -->
    <polygon points="505,195 510,325 600,310 580,225" fill="url(#g-mid-deep)" />
    <!-- Facet R4: Lower Outer Right Flank -->
    <polygon points="580,225 600,310 655,215" fill="url(#g-mid-deep)" />
    <!-- Facet R5: Outer Wing Tip Bottom Edge -->
    <polygon points="655,215 670,230 615,325 600,310" fill="url(#g-dark-shadow)" />

    <!-- ===== LOWER REFLEX KEEL (BOTTOM V ANCHOR) ===== -->
    <!-- Bottom Terminal Apex: (400, 425) -->
    <!-- Facet B1: Lower Left Keel Flank -->
    <polygon points="310,325 400,305 400,425 345,395" fill="url(#c-top-mid)" />
    <!-- Facet B2: Lower Right Keel Flank -->
    <polygon points="490,325 400,305 400,425 455,395" fill="url(#g-top-mid)" />
    <!-- Facet B3: Bottom Left Terminal Tip -->
    <polygon points="200,310 290,325 345,395 270,380" fill="url(#c-mid-deep)" />
    <!-- Facet B4: Bottom Right Terminal Tip -->
    <polygon points="600,310 490,325 455,395 530,380" fill="url(#g-mid-deep)" />
    <!-- Facet B5: Center Keel Blade Left -->
    <polygon points="400,305 345,395 400,425" fill="url(#c-top-bright)" />
    <!-- Facet B6: Center Keel Blade Right -->
    <polygon points="400,305 455,395 400,425" fill="url(#g-top-bright)" />

  </g>

  <!-- 3. Specular Ridge Lines & Sharp Edge Highlights -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.85" filter="url(#core-glow-fine)">
    <!-- Central Spine Blade -->
    <line x1="400" y1="55" x2="400" y2="180" stroke-width="2.5" />
    <line x1="400" y1="305" x2="400" y2="425" stroke-width="2.5" />

    <!-- Left Wing Leading Ridges -->
    <line x1="210" y1="130" x2="220" y2="225" stroke-width="2" stroke="#e0f2fe" />
    <line x1="210" y1="130" x2="145" y2="215" stroke-width="1.5" stroke="#bae6fd" />
    <line x1="220" y1="225" x2="200" y2="310" stroke-width="1.8" stroke="#7dd3fc" />

    <!-- Right Wing Leading Ridges -->
    <line x1="590" y1="130" x2="580" y2="225" stroke-width="2" stroke="#fef9c3" />
    <line x1="590" y1="130" x2="655" y2="215" stroke-width="1.5" stroke="#fef08a" />
    <line x1="580" y1="225" x2="600" y2="310" stroke-width="1.8" stroke="#fde047" />

    <!-- Valley Junctions -->
    <line x1="295" y1="195" x2="310" y2="325" stroke-width="1.5" stroke="#38bdf8" />
    <line x1="505" y1="195" x2="490" y2="325" stroke-width="1.5" stroke="#fbbf24" />
  </g>

  <!-- 4. Luminous Vertex Stars & Specular Glints -->
  <g filter="url(#flare-glow)">
    <!-- Main Center Apex Starburst (400, 55) -->
    <circle cx="400" cy="55" r="5" fill="#ffffff" />
    <polygon points="400,42 403,55 416,55 405,58 408,70 400,61 392,70 395,58 384,55 397,55" fill="#ffffff" opacity="0.9" />

    <!-- Left Wing Peak Glint (210, 130) -->
    <circle cx="210" cy="130" r="4" fill="#ffffff" />
    <polygon points="210,122 212,130 220,130 213,132 215,140 210,134 205,140 207,132 200,130 208,130" fill="#a5f3fc" opacity="0.8" />

    <!-- Right Wing Peak Glint (590, 130) -->
    <circle cx="590" cy="130" r="4" fill="#ffffff" />
    <polygon points="590,122 592,130 600,130 593,132 595,140 590,134 585,140 587,132 580,130 588,130" fill="#fef08a" opacity="0.8" />

    <!-- Bottom Keel Glint (400, 425) -->
    <circle cx="400" cy="425" r="4.5" fill="#ffffff" />
    <polygon points="400,415 402,425 412,425 404,427 406,437 400,430 394,437 396,427 388,425 398,425" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <g id="brand-text-werr" text-anchor="middle">
    <!-- Brand Title: werr -->
    <text x="400" y="520" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'JetBrains Mono', monospace" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="-0.04em">
      <tspan fill="#38bdf8">w</tspan><tspan fill="#f1f5f9">e</tspan><tspan fill="#fbbf24">rr</tspan>
    </text>

    <!-- Subtitle / Architecture Role -->
    <text x="400" y="560" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="0.32em" 
          fill="#38bdf8">
      GEOMETRIC REFLEX CORE
    </text>

    <!-- Architectural Motto -->
    <text x="400" y="588" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="0.1em" 
          fill="#94a3b8">
      "Don't call an API. Embed the reflex."
    </text>

    <!-- Micro Metadata -->
    <text x="400" y="612" 
          font-family="'JetBrains Mono', monospace" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="0.14em" 
          fill="#64748b">
      0-BYTE VRAM &#8226; &lt; 0.5 MS &#8226; pip install werr &#8226; werr.h
    </text>
  </g>
</svg>
