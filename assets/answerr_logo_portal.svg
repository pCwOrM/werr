<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow-answerr" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#14112e" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#090817" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04030a" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="portal-glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="portal-glow-fine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Torus Ring Gradients -->
    <linearGradient id="portal-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="crescent-highlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="inner-void-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090817" stop-opacity="0" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="text-answerr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="85%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="url(#bg-glow-answerr)" rx="20" />

  <!-- Subtle Ambient Telemetry Markings -->
  <g opacity="0.08" stroke="#818cf8" stroke-width="1">
    <line x1="120" y1="240" x2="680" y2="240" stroke-dasharray="4,8" />
    <line x1="400" y1="50" x2="400" y2="430" stroke-dasharray="4,8" />
    <circle cx="400" cy="240" r="190" fill="none" stroke-dasharray="3,7" />
  </g>

  <!-- Circuit Micro-traces connecting to the cloud -->
  <g opacity="0.12" stroke="#c084fc" stroke-width="1" fill="none">
    <path d="M 180 130 L 240 130 L 270 160" />
    <path d="M 620 130 L 560 130 L 530 160" />
    <circle cx="180" cy="130" r="2.5" fill="#a855f7" />
    <circle cx="620" cy="130" r="2.5" fill="#38bdf8" />
  </g>

  <!-- ================= THE NEON CONVERSATIONAL APERTURE ================= -->
  <g id="aperture-assembly">

    <!-- 1. Outer Ethereal Aurora Halo -->
    <circle cx="400" cy="240" r="128" fill="none" stroke="#8b5cf6" stroke-width="26" opacity="0.22" filter="url(#portal-glow-heavy)" />
    <circle cx="400" cy="240" r="118" fill="none" stroke="#38bdf8" stroke-width="16" opacity="0.32" filter="url(#portal-glow-heavy)" />

    <!-- 2. Concentric Precision Orbit Rings -->
    <!-- Segmented Outer Orbit -->
    <circle cx="400" cy="240" r="148" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="16,8,4,8" opacity="0.65" />
    <!-- Fine Middle Orbit -->
    <circle cx="400" cy="240" r="102" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="8,6" opacity="0.5" />
    <!-- Inner Fine Boundary -->
    <circle cx="400" cy="240" r="74" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3,7" opacity="0.7" />

    <!-- 3. Primary Luminous Neon Torus Ring -->
    <circle cx="400" cy="240" r="124" fill="none" stroke="url(#portal-sweep)" stroke-width="8" stroke-linecap="round" filter="url(#portal-glow-fine)" />

    <!-- Brilliant Specular Crescent Arc (Upper-Left Highlight) -->
    <path d="M 300 240 A 100 100 0 0 1 500 240 A 88 88 0 0 0 300 240 Z"
          fill="url(#crescent-highlight)" filter="url(#portal-glow-fine)" opacity="0.85" />

    <!-- Counter Specular Reflection (Lower-Right Arc) -->
    <path d="M 400 348 A 108 108 0 0 1 508 240"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.75" filter="url(#portal-glow-fine)" />

    <!-- 4. Floating Satellite Nodes / API Orbiters -->
    <!-- Orbiter 1: Webhook Ingestion (Top Right) -->
    <circle cx="505" cy="135" r="5" fill="#ffffff" filter="url(#sparkle-glow)" />
    <circle cx="505" cy="135" r="9.5" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.8" />

    <!-- Orbiter 2: SSE Decision Stream (Bottom Left) -->
    <circle cx="295" cy="345" r="4.5" fill="#ffffff" filter="url(#sparkle-glow)" />
    <circle cx="295" cy="345" r="8" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.8" />

    <!-- Orbiter 3: Automation Node (Zapier / n8n - Far Left) -->
    <circle cx="252" cy="240" r="3.5" fill="#38bdf8" filter="url(#sparkle-glow)" />

    <!-- Orbiter 4: Cloud Telemetry Node (Far Right) -->
    <circle cx="548" cy="240" r="3.5" fill="#a855f7" filter="url(#sparkle-glow)" />

    <!-- 5. Inner Core Aperture Void -->
    <!-- Ready to house or dock with the werr crystal core -->
    <circle cx="400" cy="240" r="54" fill="#070611" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75" />
    <circle cx="400" cy="240" r="16" fill="url(#inner-void-glow)" />
    <circle cx="400" cy="240" r="3.5" fill="#ffffff" filter="url(#sparkle-glow)" />

    <!-- Subtle Floating Stardust Specks -->
    <circle cx="370" cy="190" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="440" cy="205" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="360" cy="280" r="1.5" fill="#c084fc" opacity="0.8" />
    <circle cx="430" cy="275" r="1.5" fill="#38bdf8" opacity="0.9" />

  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <g id="brand-text-answerr" text-anchor="middle">
    <!-- Brand Title: answerr -->
    <text x="400" y="520" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif" 
          font-size="68" 
          font-weight="800" 
          letter-spacing="-0.03em"
          fill="url(#text-answerr-grad)">
      answ<tspan fill="#818cf8">e</tspan><tspan fill="#38bdf8">rr</tspan>
    </text>

    <!-- Subtitle / Platform Role -->
    <text x="400" y="560" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="0.32em" 
          fill="#a5b4fc">
      CONVERSATIONAL DECISION PLATFORM
    </text>

    <!-- Platform Motto -->
    <text x="400" y="588" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="0.1em" 
          fill="#94a3b8">
      "Zero-Hallucination System-1 Decision Cloud"
    </text>

    <!-- Endpoint & Portal Metadata -->
    <text x="400" y="612" 
          font-family="'JetBrains Mono', monospace" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="0.14em" 
          fill="#64748b">
      CLOUD REST &amp; SSE API &#8226; api.answerr.me &#8226; answerr.me
    </text>
  </g>
</svg>
