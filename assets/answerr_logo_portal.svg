<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow-answerr" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14112e" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05040a" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="portal-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Portal Sweep Gradients -->
    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="inner-stream-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="text-answerr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bg-glow-answerr)" rx="16" />

  <!-- Subtle Ambient Background Aperture Ring -->
  <circle cx="400" cy="240" r="160" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.12" stroke-dasharray="3,6" />
  <circle cx="400" cy="240" r="190" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.08" stroke-dasharray="6,10" />

  <!-- ================= LOGO SYMBOL: THE CONVERSATIONAL PORTAL APERTURE ================= -->
  <g id="answerr-portal-group" transform="translate(0, 0)">

    <!-- 1. Outer Diffuse Halo -->
    <circle cx="400" cy="240" r="115" fill="none" stroke="#8b5cf6" stroke-width="16" opacity="0.25" filter="url(#portal-glow)" />
    <circle cx="400" cy="240" r="105" fill="none" stroke="#38bdf8" stroke-width="10" opacity="0.35" filter="url(#portal-glow)" />

    <!-- 2. Concentric Orbit Rings (Telemetric Layers) -->
    <!-- Fine Segmented Outer Ring -->
    <circle cx="400" cy="240" r="128" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="14,6,4,6" opacity="0.6" />
    <!-- Fine Middle Ring -->
    <circle cx="400" cy="240" r="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.5" />
    <!-- Fine Inner Ring -->
    <circle cx="400" cy="240" r="68" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="2,6" opacity="0.7" />

    <!-- 3. Primary Glowing Aperture Ring (The Core Vortex) -->
    <circle cx="400" cy="240" r="110" fill="none" stroke="url(#portal-grad)" stroke-width="6.5" stroke-linecap="round" filter="url(#ring-glow)" />

    <!-- Dynamic Dialogue Sweep Wave (Crescent Energy Arc) -->
    <path d="M 310 240 A 90 90 0 1 1 490 240 A 82 82 0 1 0 310 240 Z"
          fill="url(#inner-stream-grad)" filter="url(#portal-glow)" opacity="0.75" />

    <!-- Secondary Counter-Flow Arc -->
    <path d="M 400 150 A 90 90 0 0 1 478 285"
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#ring-glow)" />

    <!-- 4. Satellite Nodes / Microservice API Orbiters -->
    <!-- Node 1 (Top Right - Webhook Hub) -->
    <circle cx="488" cy="152" r="5" fill="#ffffff" filter="url(#ring-glow)" />
    <circle cx="488" cy="152" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

    <!-- Node 2 (Bottom Left - Stream SSE) -->
    <circle cx="312" cy="328" r="4" fill="#ffffff" filter="url(#ring-glow)" />
    <circle cx="312" cy="328" r="7" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7" />

    <!-- Node 3 (Far Right Telemetry) -->
    <circle cx="528" cy="240" r="3.5" fill="#38bdf8" filter="url(#ring-glow)" />

    <!-- 5. Inner Core Void with Subtle Spark (Ready to house the werr reflex core) -->
    <circle cx="400" cy="240" r="48" fill="#090814" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="400" cy="240" r="3" fill="#ffffff" filter="url(#ring-glow)" />
    <circle cx="400" cy="240" r="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3" />

  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <g id="brand-text-answerr" text-anchor="middle">
    <!-- Brand Title: answerr -->
    <text x="400" y="495" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-0.03em"
          fill="url(#text-answerr-grad)">
      answ<tspan fill="#818cf8">e</tspan><tspan fill="#38bdf8">rr</tspan>
    </text>

    <!-- Subtitle / Platform Tagline -->
    <text x="400" y="534" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.25em" 
          fill="#a5b4fc">
      CONVERSATIONAL DECISION PLATFORM
    </text>

    <!-- Cloud API & Endpoint Badge -->
    <text x="400" y="560" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.12em" 
          fill="#64748b">
      CLOUD SYSTEM-1 API &bull; api.answerr.me &bull; answerr.me
    </text>
  </g>
</svg>
