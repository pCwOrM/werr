name = "werracle_proof"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WerracleProof"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "WerracleProof"
