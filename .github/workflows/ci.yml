name: CI Workflow

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Validate Python Syntax & Compilation
        run: |
          python -m py_compile src/*.py tests/*.py

      - name: Run Lint Check (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Automated Unit Tests
        run: |
          python -m unittest discover tests -v

      - name: Verify 128x128 Procedural Synthesis Smoke Test
        run: |
          python -c "from src.mandelbrot_core import compute_mandelbrot_patch, extract_quadrant_weights; r, a, iters = compute_mandelbrot_patch(-0.056, 0.806, 1.5, res=128, max_iter=100); w1, w2, w3, b, _ = extract_quadrant_weights(iters); print(f'Synthesized w1={w1:.3f}, w2={w2:.3f}, bias={b:.3f}')"
