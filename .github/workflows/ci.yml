name: CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8 Pillow

      - name: Validate Python Syntax & Compilation
        run: |
          python -m py_compile werr/*.py tests/*.py

      - name: Run Lint Check (Flake8 critical errors)
        run: |
          flake8 werr/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Automated Unit & Benchmark Tests
        run: |
          python -m unittest discover tests -v

      - name: Verify Core In-Process Smoke Test
        run: |
          python -c "from werr.engine import WerrEngine; from werr.datatypes import NoulQuestion; e = WerrEngine(); r = e.decide({'failed_attempts': 0, 'req_frequency': 2.0}, {'safe': NoulQuestion(instructions='Is request safe?')}); print('Decision:', r.answers['safe'].decision, '| Latency:', r.latency_ms, 'ms'); assert r.answers['safe'].decision == True"
